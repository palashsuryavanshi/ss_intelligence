<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep navy to near-black -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#0D1B2E"/>
      <stop offset="100%" style="stop-color:#060D18"/>
    </linearGradient>
  </defs>

  <!-- Background: solid deep navy gradient, fills entire canvas -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Subtle grid texture -->
  <g opacity="0.04">
    <line x1="256" y1="0" x2="256" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="768" y1="0" x2="768" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="256" x2="1024" y2="256" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="512" x2="1024" y2="512" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="768" x2="1024" y2="768" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>