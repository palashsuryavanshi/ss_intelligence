<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep navy to near-black -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#0D1B2E"/>
      <stop offset="100%" style="stop-color:#060D18"/>
    </linearGradient>

    <!-- Primary symbol gradient: blue to cyan -->
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>

    <!-- Card gradient: lighter blue to cyan -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>

    <!-- Card gradient 2: deeper blue -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D4ED8"/>
      <stop offset="100%" style="stop-color:#0284C7"/>
    </linearGradient>

    <!-- Card gradient 3: cyan accent -->
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>

    <!-- Sparkle gradient: bright cyan to white -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67E8F9"/>
      <stop offset="100%" style="stop-color:#A5F3FC"/>
    </linearGradient>

    <!-- Soft shadow for depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle glow for sparkle -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Rounded square clip for background -->
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="1024" height="1024" rx="236" ry="236"/>
    </clipPath>
  </defs>

  <!-- Background: rounded square with deep navy gradient -->
  <rect x="0" y="0" width="1024" height="1024" rx="236" ry="236" fill="url(#bgGrad)"/>

  <!-- Subtle background texture: faint grid lines -->
  <g clip-path="url(#roundedSquare)" opacity="0.04">
    <line x1="256" y1="0" x2="256" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="768" y1="0" x2="768" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="256" x2="1024" y2="256" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="512" x2="1024" y2="512" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="768" x2="1024" y2="768" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Main symbol group: screenshot stack + AI sparkle -->
  <g filter="url(#softShadow)">

    <!-- Back card (largest, bottom-left, rotated slightly) -->
    <g transform="translate(180, 220) rotate(-8)">
      <rect x="0" y="0" width="320" height="420" rx="32" ry="32" fill="url(#cardGrad2)" opacity="0.7"/>
      <!-- UI content blocks on back card -->
      <rect x="32" y="32" width="180" height="16" rx="8" ry="8" fill="#FFFFFF" opacity="0.15"/>
      <rect x="32" y="64" width="120" height="12" rx="6" ry="6" fill="#FFFFFF" opacity="0.1"/>
      <rect x="32" y="100" width="256" height="120" rx="16" ry="16" fill="#FFFFFF" opacity="0.08"/>
      <rect x="32" y="240" width="160" height="12" rx="6" ry="6" fill="#FFFFFF" opacity="0.1"/>
      <rect x="32" y="268" width="200" height="12" rx="6" ry="6" fill="#FFFFFF" opacity="0.08"/>
      <rect x="32" y="300" width="140" height="12" rx="6" ry="6" fill="#FFFFFF" opacity="0.06"/>
    </g>

    <!-- Middle card (medium, center, slight rotation) -->
    <g transform="translate(340, 180) rotate(3)">
      <rect x="0" y="0" width="300" height="400" rx="28" ry="28" fill="url(#cardGrad1)"/>
      <!-- UI content blocks on middle card -->
      <rect x="28" y="28" width="160" height="14" rx="7" ry="7" fill="#FFFFFF" opacity="0.2"/>
      <rect x="28" y="56" width="100" height="10" rx="5" ry="5" fill="#FFFFFF" opacity="0.12"/>
      <rect x="28" y="88" width="244" height="100" rx="12" ry="12" fill="#FFFFFF" opacity="0.1"/>
      <rect x="28" y="208" width="140" height="10" rx="5" ry="5" fill="#FFFFFF" opacity="0.12"/>
      <rect x="28" y="232" width="180" height="10" rx="5" ry="5" fill="#FFFFFF" opacity="0.08"/>
      <rect x="28" y="260" width="120" height="10" rx="5" ry="5" fill="#FFFFFF" opacity="0.06"/>
      <rect x="28" y="300" width="244" height="60" rx="12" ry="12" fill="#FFFFFF" opacity="0.05"/>
    </g>

    <!-- Front card (smallest, top-right, organized position) -->
    <g transform="translate(520, 260) rotate(-2)">
      <rect x="0" y="0" width="260" height="340" rx="24" ry="24" fill="url(#cardGrad3)"/>
      <!-- UI content blocks on front card -->
      <rect x="24" y="24" width="140" height="12" rx="6" ry="6" fill="#FFFFFF" opacity="0.25"/>
      <rect x="24" y="50" width="90" height="8" rx="4" ry="4" fill="#FFFFFF" opacity="0.15"/>
      <rect x="24" y="76" width="212" height="80" rx="10" ry="10" fill="#FFFFFF" opacity="0.12"/>
      <rect x="24" y="172" width="120" height="8" rx="4" ry="4" fill="#FFFFFF" opacity="0.15"/>
      <rect x="24" y="192" width="160" height="8" rx="4" ry="4" fill="#FFFFFF" opacity="0.1"/>
      <rect x="24" y="220" width="212" height="50" rx="10" ry="10" fill="#FFFFFF" opacity="0.06"/>
    </g>

    <!-- AI Sparkle: four-point star, integrated at top-right of front card -->
    <g transform="translate(720, 200)" filter="url(#sparkleGlow)">
      <!-- Four-point star shape -->
      <path d="M0,-48 C6,-20 20,-6 48,0 C20,6 6,20 0,48 C-6,20 -20,6 -48,0 C-20,-6 -6,-20 0,-48 Z" fill="url(#sparkleGrad)"/>
      <!-- Inner bright core -->
      <path d="M0,-24 C3,-10 10,-3 24,0 C10,3 3,10 0,24 C-3,10 -10,3 -24,0 C-10,-3 -3,-10 0,-24 Z" fill="#E0F2FE" opacity="0.9"/>
    </g>

    <!-- Secondary smaller sparkle for depth -->
    <g transform="translate(240, 160)" filter="url(#sparkleGlow)">
      <path d="M0,-20 C3,-8 8,-3 20,0 C8,3 3,8 0,20 C-3,8 -8,3 -20,0 C-8,-3 -3,-8 0,-20 Z" fill="url(#sparkleGrad)" opacity="0.7"/>
    </g>

  </g>

  <!-- Subtle bottom gradient overlay for depth -->
  <rect x="0" y="0" width="1024" height="1024" rx="236" ry="236" fill="url(#bgGrad)" opacity="0.1" clip-path="url(#roundedSquare)"/>
</svg>